# Publishes the Mushaf reader (viewer/) to GitHub Pages on every push to main.
# The 604 page files are not in git: they are generated here with viewer/build_pages.py.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

name: Publish reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Generate the 604 pages and the reader's data
        run: python viewer/build_pages.py

      - name: Collect the site (the reader without its build scripts)
        run: rsync -a --exclude '*.py' --exclude '__pycache__/' viewer/ _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
